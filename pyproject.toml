[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-workflow-viz"
version = "1.0.0a1"
description = "Live Mermaid flowchart of a Claude Code Workflow run, driven by hooks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Luke Wilson" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/lukedawilson/claude-workflow-viz"

[project.scripts]
claude-workflow-viz = "claude_workflow_viz.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6.100", "packaging>=24"]

[project.optional-dependencies]
# Mirrors [dependency-groups].dev; pip (and release.yml) can only see this table.
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6.100", "packaging>=24"]

[tool.hatch.build.targets.sdist]
# Only ship what a Python package needs. By default hatchling packs every
# git-tracked file, which would drag in AGENTS.md, .aidlc/, agentic-dev-loop/,
# planning-docs, uv.lock, etc.
include = [
    "src/**",
    "CHANGELOG.md",
]
# README.md, LICENSE, and pyproject.toml are force-included by hatchling.

[tool.hatch.build.targets.wheel]
packages = [
    "src/claude_workflow_viz",
    "src/claude_workflow_viz.workflow",
    "src/claude_workflow_viz.graph",
    "src/claude_workflow_viz.graph_source",
    "src/claude_workflow_viz.dashboard",
    "src/claude_workflow_viz.invoke",
    "src/claude_workflow_viz.install",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
